<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orc Siege Incremental</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- 메뉴 화면 -->
    <section id="screen-menu" class="screen active">
      <h1>ORC SIEGE</h1>
      <p class="subtitle">오크 무리로부터 기지를 지켜내는 인크리멘탈 타워 디펜스</p>
      <div class="menu-stats">보유 정수: <span id="menu-essence">0</span> 💠</div>
      <div class="menu-buttons">
        <button id="btn-start" class="primary-btn">런 시작</button>
        <button id="btn-open-upgrades" class="secondary-btn">업그레이드 트리</button>
      </div>
      <p class="hint">런은 승리하든 패배하든 정수를 지급합니다. 정수로 영구 업그레이드를 구매하세요.</p>
    </section>

    <!-- 게임 화면 -->
    <section id="screen-game" class="screen">
      <div class="hud">
        <div class="hud-item">💰 <span id="hud-gold">0</span></div>
        <div class="hud-item">❤️ <span id="hud-hp">0 / 0</span></div>
        <div class="hud-item">🗼 <span id="hud-slots">0 / 1</span></div>
        <div class="hud-item">💀 <span id="hud-progress">0 / 0</span></div>
        <button id="btn-speed" class="hud-item speed-btn" type="button">1x</button>
        <div class="hud-item status" id="hud-status">대기 중</div>
      </div>
      <canvas id="game-canvas" width="900" height="600"></canvas>
      <div id="tower-buttons" class="tower-buttons"></div>
    </section>

    <!-- 업그레이드 트리 화면 -->
    <section id="screen-upgrades" class="screen">
      <h2>업그레이드 트리</h2>
      <div class="menu-stats">보유 정수: <span id="upgrade-essence">0</span> 💠</div>
      <div id="upgrade-list" class="upgrade-list"></div>
      <button id="btn-upgrades-back" class="secondary-btn">메뉴로</button>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <h2 id="result-title"></h2>
      <div class="result-stats">
        <div>처치한 오크: <span id="result-waves"></span></div>
        <div>획득한 정수: <span id="result-essence"></span> 💠</div>
      </div>
      <div class="menu-buttons">
        <button id="btn-result-retry" class="primary-btn">다시 도전</button>
        <button id="btn-result-menu" class="secondary-btn">메뉴로</button>
      </div>
    </section>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
